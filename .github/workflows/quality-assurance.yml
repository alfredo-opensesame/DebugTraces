name: Quality Assurance

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  static-analysis:
    name: Static Analysis (Clang-Tidy)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build gcc-12 g++-12 clang-15 clang-tidy-15
        # Completely remove GCC 14 and its libraries
        sudo apt-get remove -y gcc-14 g++-14 libgcc-14-dev gcc-14-base 2>/dev/null || true
        sudo apt-get autoremove -y
        # Reset alternatives system
        sudo update-alternatives --remove-all gcc 2>/dev/null || true
        sudo update-alternatives --remove-all g++ 2>/dev/null || true
        # Install GCC 12 as the primary compiler
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 100
        # Force environment variables for consistency
        export CC=/usr/bin/gcc-12
        export CXX=/usr/bin/g++-12
        # Create symlinks for clang-tidy command
        sudo ln -sf /usr/bin/clang-tidy-15 /usr/bin/clang-tidy
        # Verify compiler version and standard library
        gcc --version
        g++ --version
        echo "Standard library path:"
        g++ -v -E -x c++ - < /dev/null 2>&1 | grep -E "(gcc|collect2|ld)"
        
    - name: Configure CMake
      run: |
        export CC=/usr/bin/gcc-12
        export CXX=/usr/bin/g++-12
        cmake --preset clang-tidy
      
    - name: Build with Clang-Tidy
      run: |
        export CC=/usr/bin/gcc-12
        export CXX=/usr/bin/g++-12
        cmake --build build/clang-tidy --target dbgtracing
      
    - name: Upload Clang-Tidy results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: clang-tidy-results
        path: build/clang-tidy/

  sanitizer-tests:
    name: Sanitizer Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sanitizer: [asan, tsan, ubsan]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build gcc-12 g++-12
        # Remove any existing GCC 14 to avoid conflicts
        sudo apt-get remove -y gcc-14 g++-14 2>/dev/null || true
        # Use GCC 12 for better C++20 compatibility
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 100
        # Verify compiler version
        gcc --version
        
    - name: Configure CMake (${{ matrix.sanitizer }})
      run: cmake --preset ${{ matrix.sanitizer }}
      
    - name: Build (${{ matrix.sanitizer }})
      run: cmake --build build/${{ matrix.sanitizer }}
      
    - name: Run tests (${{ matrix.sanitizer }})
      run: |
        cd build/${{ matrix.sanitizer }}
        ctest --output-on-failure --timeout 300
        
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.sanitizer }}-test-results
        path: build/${{ matrix.sanitizer }}/Testing/

  cross-platform:
    name: Cross-Platform Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        build-type: [Debug, Release]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build gcc-12 g++-12
        # Remove any existing GCC 14 to avoid conflicts
        sudo apt-get remove -y gcc-14 g++-14 2>/dev/null || true
        # Use GCC 12 for better C++20 compatibility
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 100
        # Verify compiler version
        gcc --version
        
    - name: Install dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install cmake ninja googletest
        
    - name: Configure CMake (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        if [ "${{ matrix.build-type }}" = "Debug" ]; then
          cmake --preset dev-debug
        else
          cmake --preset dev-release
        fi
        
    - name: Build
      run: |
        if [ "${{ matrix.build-type }}" = "Debug" ]; then
          cmake --build build/dev-debug
        else
          cmake --build build/dev-release
        fi
        
    - name: Test (Debug builds only)
      if: matrix.build-type == 'Debug'
      run: |
        cd build/dev-debug && ctest --output-on-failure

  comprehensive-qa:
    name: Comprehensive QA Suite
    runs-on: ubuntu-latest
    needs: [static-analysis, sanitizer-tests]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build gcc-12 g++-12 clang-15 clang-tidy-15
        # Use GCC 12 for better C++20 compatibility
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 100
        # Create symlinks for default clang-tidy command
        sudo ln -sf /usr/bin/clang-tidy-15 /usr/bin/clang-tidy
        
    - name: Run comprehensive quality checks
      run: ./cmake/run-quality-checks.sh
      
    - name: Upload comprehensive results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: comprehensive-qa-results
        path: |
          build/*/
          !build/*/CMakeFiles/
          !build/*/*.o
          !build/*/*.a